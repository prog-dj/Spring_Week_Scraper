name: Scrape opportunities

on:
  schedule:
    # Twice daily, fixed to GMT (UTC+0) year-round -- 00:02 and 09:10 GMT.
    # cron is always UTC and doesn't shift for BST, so these stay pinned to
    # GMT clock time even during British Summer Time (an hour earlier than
    # 9:10/12:02 local in the summer). GitHub's scheduler is best-effort and
    # can lag a few minutes during high load.
    - cron: "2 0 * * *"
    - cron: "10 9 * * *"
  workflow_dispatch: {} # lets an admin trigger a run early from the Worker's /api/discover, or manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run scraper and push results
        env:
          SPRINGR_WORKER_URL: ${{ secrets.SPRINGR_WORKER_URL }}
          SPRINGR_INGEST_SECRET: ${{ secrets.SPRINGR_INGEST_SECRET }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python -m scraping.push_adapter
