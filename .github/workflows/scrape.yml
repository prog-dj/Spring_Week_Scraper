name: Scrape opportunities

on:
  schedule:
    # Every 6 hours. GitHub's scheduler is best-effort and can lag during high
    # load, so treat this as "roughly every 6 hours," not exact.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets an admin trigger a run early from the Worker's /api/discover, or manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run scraper and push results
        env:
          SPRINGR_WORKER_URL: ${{ secrets.SPRINGR_WORKER_URL }}
          SPRINGR_INGEST_SECRET: ${{ secrets.SPRINGR_INGEST_SECRET }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python -m scraping.push_adapter
